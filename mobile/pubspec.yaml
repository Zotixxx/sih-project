name: metrix_mobile
description: "MetriX - Legal Metrology Field Inspection & Verification Mobile App for LMOs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & State
  provider: ^6.1.1
  
  # Local Storage & Offline Database
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # Network & API
  http: ^1.1.0
  connectivity_plus: ^5.0.2
  
  # QR & Crypto
  qr_flutter: ^4.1.0
  crypto: ^3.0.3
  
  # Utilities & UI
  intl: ^0.19.0
  google_fonts: ^6.1.0
  lucide_icons: ^0.257.0
  geolocator: ^10.1.0
  image_picker: ^1.0.4
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
