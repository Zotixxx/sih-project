name: metrix_mobile
description: "MetriX - Legal Metrology Field Inspection & Verification Mobile App for LMOs"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Navigation & State
  provider: ^6.1.1

  # Session Storage
  shared_preferences: ^2.2.2
  
  # Network & API
  http: ^1.1.0
  
  # Utilities & UI
  intl: ^0.19.0
  google_fonts: ^6.1.0
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
