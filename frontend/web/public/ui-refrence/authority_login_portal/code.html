<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body-md text-on-surface antialiased p-gutter">
<!-- Login Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-lg border border-outline-variant p-xl shadow-[0_4px_6px_-1px_rgb(0,0,0,0.1),0_2px_4px_-2px_rgb(0,0,0,0.1)] flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-sm mb-sm">
<div class="h-12 w-12 bg-primary rounded-lg flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-on-primary" data-icon="policy">policy</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary">Authority Access</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Select your department and enter your credentials</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Role Dropdown -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="authorityRole">Select Authority Role</label>
<div class="relative">
<select class="w-full h-10 px-md font-body-md text-body-md border border-outline-variant rounded bg-surface-container-lowest text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 appearance-none" id="authorityRole">
<option disabled="" selected="" value="">Select Role...</option>
<option value="lmo">Legal Metrology Officer (LMO)</option>
<option value="gatc">GATC Official</option>
<option value="admin">System Administrator</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-md text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="username">Username / Badge ID</label>
<input class="w-full h-10 px-md font-body-md text-body-md border border-outline-variant rounded bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-colors" id="username" placeholder="e.g. LMO-9428" type="text">
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full h-10 px-md font-body-md text-body-md border border-outline-variant rounded bg-surface-container-lowest text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-colors" id="password" placeholder="••••••••" type="password">
</div>
<!-- CTA -->
<button class="w-full h-12 bg-primary text-on-primary font-title-md text-title-md rounded mt-sm hover:bg-primary/90 transition-colors flex items-center justify-center gap-sm active:opacity-80" type="button">
<span class="material-symbols-outlined" data-icon="lock_open">lock_open</span>
                Authorize &amp; Sign In
            </button>
</form>
<!-- Footer Link -->
<div class="mt-md text-center border-t border-outline-variant pt-md">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                Return to Business Login
            </a>
</div>
</main>
<!-- Global Footer Component injected manually due to contextual isolation -->
<footer class="w-full py-md px-gutter flex flex-col md:flex-row justify-between items-center gap-md docked full-width bottom-0 fixed border-t border-outline-variant dark:border-outline bg-surface-container-low dark:bg-surface-dim mt-auto">

        </div>
